<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa měst České republiky</title>

  <!-- Leaflet (CSS musí být načten před vlastními styly) -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="styl.css">
</head>
<body>
  <header class="hlavicka">
    <h1>Města České republiky</h1>
    <p id="pocet" class="pocet" aria-live="polite"></p>
  </header>

  <main class="obsah">
    <div id="mapa" role="application" aria-label="Mapa měst České republiky"></div>
    <div id="chyba" class="chyba" role="alert" hidden></div>
  </main>

  <!-- Leaflet JS musí být před map.js -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="map.js"></script>
</body>
</html>
